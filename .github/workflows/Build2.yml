name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q daymapa_project.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd daymapa_project && bash setup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DayMapa-apk
          path: daymapa_project/build_tmp/build/app/outputs/flutter-apk/app-release.apk
